regulation_id: cerc_dsm_2024_draft
name: CERC DSM 2024 (Draft)
description: Draft CERC (Deviation Settlement Mechanism and Related Matters) Regulations, 2024. Narrows
  the permissible deviation band to ±7%, raises the penalty rate to 2.0x and adds a 1.5x surcharge on
  deviation beyond ±15% of schedule.
effective_date: '2024-01-01'
status: draft
price_floor: 0.0
price_ceiling: 12.0
deviation_band: 0.07
penalty_rate: 2.0
severe_deviation_threshold: 0.15
severe_penalty_multiplier: 1.5
technical_minimum_mw: 1.0
